# docker compose up --build  ->  http://localhost:3000 backed by Postgres 17
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: split
      POSTGRES_PASSWORD: split
      POSTGRES_DB: split_ledger
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split -d split_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://split:split@db:5432/split_ledger
      # Cookies are only marked Secure behind HTTPS; plain localhost needs this off.
      SECURE_COOKIES: "0"
    ports:
      - "3000:3000"

volumes:
  db-data:
